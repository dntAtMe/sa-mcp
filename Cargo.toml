[workspace]
resolver = "2"
members = ["crates/proto", "crates/sa-sdk", "crates/sa-bridge", "crates/sa-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
