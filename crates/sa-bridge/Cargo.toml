[package]
name = "sa-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ASI plugin for GTA San Andreas 1.0 US exposing game state over a local JSON socket"

[lib]
crate-type = ["cdylib"]

[dependencies]
proto = { path = "../proto" }
sa-sdk = { path = "../sa-sdk" }
serde_json.workspace = true

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_LibraryLoader",
]
