[package]
name = "sa-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server (stdio) for inspecting and controlling GTA San Andreas via sa-bridge"

[dependencies]
proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
png = "0.17"
base64 = "0.22"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
]
